<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Advize Store — Start Selling in 5 Minutes</title>
    <meta name="description" content="Create your own online store with Advize. Sell products, showcase your brand, and grow your business with an easy-to-use platform built for local sellers and creators." />

    <!-- Favicon — ICO first (Google crawler uses this) -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://store.advize.in/" />
    <meta property="og:title" content="Advize Store — Start Selling in 5 Minutes" />
    <meta property="og:description" content="Create your own online store with Advize. Sell products, showcase your brand, and grow your business with an easy-to-use platform built for local sellers and creators." />
    <meta property="og:image" content="https://store.advize.in/opengraph.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:site_name" content="Advize Store" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Advize Store — Start Selling in 5 Minutes" />
    <meta name="twitter:description" content="Create your own online store with Advize. Sell products, showcase your brand, and grow your business with an easy-to-use platform built for local sellers and creators." />
    <meta name="twitter:image" content="https://store.advize.in/opengraph.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      try {
        if (localStorage.getItem("shop-dark-mode") !== "false") {
          document.documentElement.classList.add("dark");
        }
      } catch {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
